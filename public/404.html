<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting — Khushie V3</title>
  <script>
    // GitHub Pages SPA Subpath & Deep-Link Preserver
    (function () {
      var l = window.location;
      var known = ['/story', '/memories', '/message', '/fun-zone', '/gifts', '/surprise', '/cake', '/finale'];
      var matched = null;
      for (var i = 0; i < known.length; i++) {
        if (l.pathname.endsWith(known[i])) {
          matched = known[i];
          break;
        }
      }
      if (matched) {
        var base = l.pathname.slice(0, l.pathname.length - matched.length) || '/';
        if (!base.endsWith('/')) base += '/';
        l.replace(l.protocol + '//' + l.host + base + '#' + matched);
      } else {
        var dir = l.pathname.replace(/\/[^/]*$/, '/');
        l.replace(l.protocol + '//' + l.host + dir + '#/404-not-found');
      }
    })();
  </script>
</head>
<body style="background:#0B0910;color:#FAF6F8;font-family:sans-serif;text-align:center;padding:48px;">
  <p>Redirecting to Khushie V3...</p>
  <p><a href="./index.html" style="color:#F2D0A9;">Return to Khushie V3 Home</a></p>
</body>
</html>
